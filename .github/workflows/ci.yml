name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install "pytest>=7.3" "pytest-xdist>=3.0"
      - name: The door imports only the standard library
        run: python -I tools/check_stdlib_only.py
      - name: Tests
        run: python -m pytest -q -n auto

  # A test that depends on luck passes once and fails on the next leg (#84 to
  # #87, #93). The test files a pull request adds or changes run ten times, which
  # catches a one-in-five flake before merge rather than after.
  changed-tests:
    name: Changed tests, ten times
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install "pytest>=7.3" "pytest-xdist>=3.0"
      - name: Run each changed test file ten times
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- 'tests/test_*.py')
          if [ -z "$files" ]; then
            echo "No test file changed."
            exit 0
          fi
          echo "$files"
          for run in $(seq 1 10); do
            echo "::group::Run $run of 10"
            python -m pytest -q -n auto -p no:cacheprovider $files
            echo "::endgroup::"
          done

  # Balance and dead ends only show across many careers: seven careers in 800
  # were towed home for their whole run before #90, and every unit test passed.
  # Fifty careers per pilot, a hundred days each; tools/check_careers.py fails on
  # a career that did not fly, one towed home more than twice, or a pilot whose
  # median day-100 net worth halved or doubled.
  career-health:
    name: Career health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fly fifty careers per pilot
        run: python tools/career_sim.py --seeds 50 --json careers.json
      - name: Check them
        run: python tools/check_careers.py careers.json
      - name: Keep the careers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careers
          path: careers.json
          if-no-files-found: ignore
