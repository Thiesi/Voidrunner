# Voidrunner is a single script, not a package: this file only configures the
# test run. The door itself needs Python 3.11+ and nothing beyond its standard
# library; the tests need pytest (and pytest-xdist for `-n auto`).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep only the last run's failed tests' tmp_path folders (README, "Local disk
# hygiene"); pytest's default keeps every test's folder from three runs.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
